<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JobFlow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>JobFlow</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#f4f6f4;color:#101210;padding-bottom:78px}
header{background:#0d0f0e;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:3}header .brand{font-size:22px;font-weight:800;display:flex;gap:8px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:#39d353}.sub{color:#9da49f;font-size:11px;margin-top:5px}
main{padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{font-size:25px;margin:0}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750}.green{background:#39d353;color:#061008}.white{background:#fff;border:1px solid #dfe4e0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#fff;border:1px solid #e1e6e2;border-radius:15px;padding:15px}.stat b{font-size:25px;display:block}.stat span{font-size:11px;color:#737a75}.card{background:#fff;border:1px solid #e0e5e1;border-radius:15px;padding:15px;margin-bottom:10px}.card h3{margin:0 0 5px;font-size:16px}.muted{font-size:12px;color:#737a75}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{background:#edf0ed;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:800}.job{border-left:5px solid #39d353}.job.black{border-left-color:#101210}.job.mint{border-left-color:#2bbf8a}.job.slate{border-left-color:#7c8580}.calendar{background:#fff;border:1px solid #e0e5e1;border-radius:15px;overflow:auto}.calhead,.caldays{display:grid;grid-template-columns:repeat(7, minmax(76px,1fr));min-width:532px}.calhead div{text-align:center;padding:9px 2px;font-size:10px;font-weight:800;color:#777}.day{min-height:88px;border-top:1px solid #e7eae7;border-right:1px solid #e7eae7;padding:5px}.day:nth-child(7n){border-right:0}.num{font-size:10px;color:#7c837e;text-align:right}.today{background:#111;color:#fff;border-radius:50%;padding:3px 5px}.chip{font-size:9px;font-weight:750;padding:5px;border-radius:7px;background:#d9f7df;margin-top:4px;overflow:hidden;white-space:nowrap}.chip.black{background:#161917;color:#fff}.chip.mint{background:#d2f5e8}.chip.slate{background:#e7eae8}.empty{text-align:center;padding:45px 10px;color:#7a817c}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:4}.nav button{border:0;background:transparent;font-size:10px;color:#777;padding:5px}.nav button.active{color:#15952b;font-weight:800}.nav strong{display:block;font-size:19px;line-height:20px}.modal{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 15px}.form{display:grid;gap:12px}label{font-size:11px;font-weight:750;display:grid;gap:6px}input,select,textarea{font:inherit;border:1px solid #d9dfdb;border-radius:11px;padding:11px;width:100%;background:#fff}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:5px}.hidden{display:none}.file{font-size:11px;background:#f1f4f1;padding:8px;border-radius:8px}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 10px}
</style>
</head>
<body>
<header><div class="brand"><span class="dot"></span> JobFlow</div><div class="sub">Simple job management</div></header>
<main id="app"></main>
<nav class="nav">
<button data-view="calendar" class="active"><strong>▦</strong>Calendar</button>
<button data-view="jobs"><strong>▤</strong>Jobs</button>
<button data-view="clients"><strong>◎</strong>Clients</button>
<button data-view="quotes"><strong>£</strong>Quotes</button>
</nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script>
const K="jobflow_phone_v2";let d=JSON.parse(localStorage.getItem(K)||"null")||{clients:[],jobs:[],quotes:[]};let view="calendar",month=new Date();month.setDate(1);
const $=x=>document.getElementById(x),save=()=>localStorage.setItem(K,JSON.stringify(d)),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),iso=x=>{x=new Date(x);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)},fmt=x=>new Date(x+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}),cn=id=>d.clients.find(x=>x.id===id)?.name||"No client";
function render(){document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.view===view));({calendar, jobs, clients, quotes}[view])()}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7,today=iso(new Date());let h=`<div class="top"><h1>${month.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</h1><button class="btn green" onclick="newJob()">＋ Job</button></div><div class="card"><div class="row"><button class="btn white" onclick="prev()">‹</button><button class="btn white" onclick="next()">›</button></div></div><div class="calendar"><div class="calhead">${["M","T","W","T","F","S","S"].map(x=>`<div>${x}</div>`).join("")}</div><div class="caldays">`;
let total=Math.ceil((start+days)/7)*7;for(let i=0;i<total;i++){let n=i-start+1,dt=new Date(y,m,n),ds=iso(dt),outside=dt.getMonth()!=m;h+=`<div class="day"><div class="num">${outside?"":`<span class="${ds==today?"today":""}">${dt.getDate()}</span>`}</div>`;d.jobs.filter(j=>ds>=j.start&&ds<=j.end).forEach(j=>h+=`<div class="chip ${j.color}" onclick="editJob('${j.id}')">${esc(j.name)}</div>`);h+="</div>"}$("app").innerHTML=h+"</div></div>"}
function jobs(){let h=`<div class="top"><h1>Jobs</h1><button class="btn green" onclick="newJob()">＋ Job</button></div><div class="grid"><div class="stat"><b>${d.jobs.length}</b><span>Total jobs</span></div><div class="stat"><b>${d.jobs.filter(x=>x.status=="In Progress").length}</b><span>In progress</span></div></div><div class="section">`;h+=d.jobs.length?d.jobs.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(j=>`<div class="card job ${j.color}"><div class="row"><h3>${esc(j.name)}</h3><span class="badge">${esc(j.status)}</span></div><div class="muted">${esc(cn(j.clientId))} · ${fmt(j.start)} → ${fmt(j.end)}</div><p>${esc(j.notes||"")}</p><button class="btn white" onclick="editJob('${j.id}')">Open</button></div>`).join(""):`<div class="empty">No jobs yet.</div>`;$("app").innerHTML+=h+"</div>"}
function clients(){let h=`<div class="top"><h1>Clients</h1><button class="btn green" onclick="newClient()">＋ Client</button></div>`;h+=d.clients.length?d.clients.map(c=>`<div class="card"><div class="row"><h3>${esc(c.name)}</h3><span class="badge">${d.jobs.filter(j=>j.clientId==c.id).length} jobs</span></div><div class="muted">${esc(c.phone||"")} ${c.email?"· "+esc(c.email):""}</div><p class="muted">${esc(c.address||"")}</p></div>`).join(""):`<div class="empty">No clients yet.</div>`;$("app").innerHTML=h}
function quotes(){let h=`<div class="top"><h1>Quotes</h1><button class="btn green" onclick="newQuote()">＋ Quote</button></div>`;h+=d.quotes.length?d.quotes.map(q=>`<div class="card"><div class="row"><div><h3>${esc(q.description)}</h3><div class="muted">${esc(cn(q.clientId))} · ${q.status}</div></div><b>£${q.amount.toFixed(2)}</b></div><div style="margin-top:10px"><button class="btn white" onclick="printQuote('${q.id}')">PDF / Print</button></div></div>`).join(""):`<div class="empty">No quotes yet.</div>`;$("app").innerHTML=h}
function open(s){$("sheet").innerHTML=s;$("modal").classList.remove("hidden")}function close(){$("modal").classList.add("hidden")}
function newClient(){open(`<h2>New client</h2><form class="form" id="cf"><label>Name<input id="n" required></label><label>Phone<input id="p"></label><label>Email<input id="e" type="email"></label><label>Address<input id="a"></label><label>Notes<textarea id="no"></textarea></label><div class="actions"><button type="button" class="btn white" onclick="close()">Cancel</button><button class="btn green">Save</button></div></form>`);$("cf").onsubmit=e=>{e.preventDefault();d.clients.push({id:id(),name:$("n").value,phone:$("p").value,email:$("e").value,address:$("a").value,notes:$("no").value});save();close();render()}}
function clientOptions(sel){return d.clients.map(c=>`<option value="${c.id}" ${c.id==sel?"selected":""}>${esc(c.name)}</option>`).join("")}
function jobForm(j={}){if(!d.clients.length){alert("Please add a client first.");newClient();return}open(`<h2>${j.id?"Edit":"New"} job</h2><form class="form" id="jf"><label>Job name<input id="n" required value="${esc(j.name||"")}"></label><label>Client<select id="c">${clientOptions(j.clientId||d.clients[0].id)}</select></label><div class="grid"><label>Start<input id="s" type="date" required value="${j.start||iso(new Date())}"></label><label>End<input id="en" type="date" required value="${j.end||iso(new Date())}"></label></div><div class="grid"><label>Status<select id="st">${["Booked","Quoted","In Progress","Completed"].map(x=>`<option ${x==(j.status||"Booked")?"selected":""}>${x}</option>`).join("")}</select></label><label>Colour<select id="co">${["green","black","mint","slate"].map(x=>`<option ${x==(j.color||"green")?"selected":""}>${x}</option>`).join("")}</select></label></div><label><input id="wk" type="checkbox" ${j.includeWeekends?"checked":""}> Include weekends</label><label>Notes<textarea id="no">${esc(j.notes||"")}</textarea></label><label>PDF attachments<input id="files" type="file" accept="application/pdf" multiple></label><div class="actions"><button type="button" class="btn white" onclick="close()">Cancel</button><button class="btn green">Save job</button></div></form>`);$("jf").onsubmit=e=>{e.preventDefault();if($("en").value<$("s").value)return alert("End date must be after start date.");let o={id:j.id||id(),name:$("n").value,clientId:$("c").value,start:$("s").value,end:$("en").value,status:$("st").value,color:$("co").value,includeWeekends:$("wk").checked,notes:$("no").value,files:[...$("files").files].map(f=>f.name)};let i=d.jobs.findIndex(x=>x.id==o.id);i<0?d.jobs.push(o):d.jobs[i]=o;save();close();render()}}
function newJob(){jobForm()}function editJob(x){jobForm(d.jobs.find(j=>j.id==x))}
function newQuote(){if(!d.clients.length)return newClient();open(`<h2>New quote</h2><form class="form" id="qf"><label>Client<select id="c">${clientOptions(d.clients[0].id)}</select></label><label>Description<input id="de" required></label><label>Amount (£)<input id="am" type="number" min="0" step=".01" required></label><label>Status<select id="st"><option>Draft</option><option>Sent</option><option>Accepted</option><option>Declined</option></select></label><div class="actions"><button type="button" class="btn white" onclick="close()">Cancel</button><button class="btn green">Save quote</button></div></form>`);$("qf").onsubmit=e=>{e.preventDefault();d.quotes.push({id:id(),clientId:$("c").value,description:$("de").value,amount:+$("am").value,status:$("st").value});save();close();render()}}
function printQuote(qid){let q=d.quotes.find(x=>x.id==qid);let w=window.open("","_blank");w.document.write(`<html><head><title>Quote</title><style>body{font-family:Arial;padding:50px}h1{font-size:32px}hr{border:0;border-top:2px solid #111}strong{font-size:28px}</style></head><body><h1>JOBFLOW</h1><p>QUOTE</p><hr><h2>${esc(q.description)}</h2><p>Client: ${esc(cn(q.clientId))}</p><strong>£${q.amount.toFixed(2)}</strong><p>Status: ${q.status}</p><script>window.print()<\/script></body></html>`);w.document.close()}
function prev(){month.setMonth(month.getMonth()-1);render()}function next(){month.setMonth(month.getMonth()+1);render()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
$("modal").onclick=e=>{if(e.target.id=="modal")close()};
if(!d.clients.length){d.clients.push({id:id(),name:"Example Client",phone:"",email:"",address:"",notes:""});save()}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body></html>
